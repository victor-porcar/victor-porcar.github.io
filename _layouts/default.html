<!DOCTYPE html>
<html lang="en">
<head>{% include head.html %}</head>
<body>

{% include header.html home=true %}

<div class="hero"></div>

<main>
  <section class="intro">
    <div class="identity">
      <img class="avatar" src="{{ '/site/images/victor_profile.jpg' | relative_url }}"
           alt="{{ site.title }}" width="96" height="96">
      <h1>{{ site.title }}</h1>
    </div>
    <p class="tagline">{{ site.description }}</p>
    <div class="rule"></div>
    <div class="topics">
      {% for topic in site.topics %}
        <span>{{ topic }}</span>{% unless forloop.last %}<span>•</span>{% endunless %}
      {% endfor %}
    </div>
  </section>

  <div class="wrap">
    {{ content }}
  </div>
</main>

{% include footer.html %}

</body>
</html>
