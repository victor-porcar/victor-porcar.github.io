<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navegación Superior -->
  <header class="top-nav">
    <div class="nav-container">
      <div class="brand">Víctor Porcar</div>
      <nav>
        <a href="#">Home</a>
        <a href="#tech-talks">Tech Talks</a>
        <a href="#technical-notes">Notes</a>
        <a href="#bookmarks">Bookmarks</a>
      </nav>
    </div>
  </header>

  <!-- Sección Hero / Banner con Imagen -->
  <section class="hero-section">
    <div class="hero-image-wrapper">
      <img src="site/images/header-photo.jpg" alt="Header Image" class="hero-image">
    </div>
    <div class="hero-content">
      <h1>Víctor Porcar</h1>
      <p class="subtitle">My public IT resources gathered in one place.</p>
      <div class="tags">
        <span>Software Engineering</span> · 
        <span>Java</span> · 
        <span>Backend</span> · 
        <span>DevOps</span>
      </div>
    </div>
  </section>

  <!-- Contenido principal (aquí se renderiza tu index.md) -->
  <main class="main-container">
    {{ content }}
  </main>

  <!-- Pie de página -->
  <footer class="site-footer">
    <div class="footer-links">
      <a href="https://github.com/victor-porcar" target="_blank">GitHub</a>
      <a href="https://es.linkedin.com/in/victor-porcar-a110a533" target="_blank">LinkedIn</a>
      <a href="mailto:victormpcmun@gmail.com">Contact</a>
    </div>
  </footer>

</body>
</html>
