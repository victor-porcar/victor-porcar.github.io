<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ site.github_user }}" target="_blank" rel="noopener">
      {% include icon.html name="github" %}
      {{ site.github_handle }}
    </a>
    <nav class="nav">
      <a{% if include.home %} class="active"{% endif %} href="{{ '/' | relative_url }}">Home</a>
      {% for section in site.data.sections %}
        <a href="{{ section.nav_url }}" target="_blank" rel="noopener">{{ section.nav | default: section.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
